name: Rust CI

on:
  push:
    branches: [trunk, "patch-*", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Format and compile (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake pkg-config \
            libasound2-dev libudev-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxinerama-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdbus-1-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets
        run: cargo check --locked --all-targets
